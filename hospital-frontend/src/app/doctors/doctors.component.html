<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-file-medical text-primary"></i> Doctor Directory</h2>
    <button class="btn btn-primary" (click)="openModal()" *ngIf="auth.getRole() === 'ADMIN'">
      <i class="bi bi-plus-circle"></i> New Doctor
    </button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <form class="d-flex mb-3 w-50" (ngSubmit)="onSearch()">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
          <input type="text" class="form-control border-start-0 ps-0" placeholder="Search by name..." 
                 name="keyword" [(ngModel)]="keyword" (keyup.enter)="onSearch()">
          <button class="btn btn-outline-primary" type="submit">Search</button>
        </div>
      </form>

      <div class="table-responsive" *ngIf="doctorsPage && doctorsPage.content.length > 0; else noData">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Specialty</th>
              <th class="text-end" *ngIf="auth.getRole() === 'ADMIN'">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let m of doctorsPage.content">
              <td>#{{m.id}}</td>
              <td class="fw-bold">{{m.name}}</td>
              <td><i class="bi bi-envelope me-2 text-muted"></i>{{m.email}}</td>
              <td><span class="badge bg-info text-dark">{{m.specialty}}</span></td>
              <td class="text-end" *ngIf="auth.getRole() === 'ADMIN'">
                <button class="btn btn-sm btn-outline-info me-2" title="Edit" (click)="openModal(m)">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" title="Delete" (click)="deleteDoctor(m.id!)">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <nav class="d-flex justify-content-between align-items-center mt-3">
          <span class="text-muted small">Total: {{doctorsPage.totalElements}} doctors</span>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" [class.disabled]="currentPage === 0">
               <a class="page-link" href="javascript:void(0)" (click)="changePage(currentPage - 1)">Previous</a>
            </li>
            <li class="page-item" *ngFor="let _ of [].constructor(doctorsPage.totalPages); let i = index" 
                [class.active]="i === currentPage">
               <a class="page-link" href="javascript:void(0)" (click)="changePage(i)">{{i + 1}}</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === doctorsPage.totalPages - 1 || doctorsPage.totalPages === 0">
               <a class="page-link" href="javascript:void(0)" (click)="changePage(currentPage + 1)">Next</a>
            </li>
          </ul>
        </nav>
      </div>

      <ng-template #noData>
        <div class="text-center py-5 text-muted">
          <i class="bi bi-person-x fs-1 d-block mb-3"></i>
          <h5>No doctors found</h5>
        </div>
      </ng-template>
    </div>
  </div>
</div>

<div class="modal" tabindex="-1" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'" style="background: rgba(0,0,0,0.5)">
  <div class="modal-dialog">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title m-0">
          <i class="bi bi-person-badge"></i> {{editingId ? 'Modify Doctor' : 'New Doctor'}}
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeModal()"></button>
      </div>
      <div class="modal-body p-4">
        <form [formGroup]="doctorForm" (ngSubmit)="saveDoctor()">
          <div class="mb-3">
            <label class="form-label">Full Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="name">
          </div>
          <div class="mb-3">
            <label class="form-label">Email <span class="text-danger">*</span></label>
            <input type="email" class="form-control" formControlName="email">
          </div>
          <div class="mb-4">
            <label class="form-label">Specialty <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="specialty">
          </div>
          <div class="text-end">
            <button type="button" class="btn btn-light border me-2" (click)="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary px-4" [disabled]="doctorForm.invalid">
              <i class="bi bi-save me-1"></i> Save Doctor
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
